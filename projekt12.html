<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея фотографій</title>
  <link rel="stylesheet" href="style5.css">
</head>
<body>
  <div class="page-layout">
    <header class="header">
      <h1 class="site-title">Фотогалерея</h1>
      <nav class="nav">
        <a href="#gallery" class="nav__link">Усі фото</a>
        <a href="#gallery" class="nav__link">Природа</a>
        <a href="#gallery" class="nav__link">Архітектура</a>
        <a href="#gallery" class="nav__link">Подорожі</a>
      </nav>
    </header>

    <main id="gallery" class="main">
      <div class="gallery-grid">
        <figure class="photo-card photo-card--wide">
          <img src="https://placehold.co/900x420/1e293b/38bdf8?text=Mountain+Panorama" alt="Гірський краєвид" class="photo-card__img">
          <figcaption class="photo-card__caption">Гірська панорама на світанку</figcaption>
        </figure>

        <figure class="photo-card photo-card--tall">
          <img src="https://placehold.co/440x640/0f172a/34d399?text=Old+Tower" alt="Старовинна вежа" class="photo-card__img">
          <figcaption class="photo-card__caption">Історична вежа в центрі міста</figcaption>
        </figure>

        <figure class="photo-card">
          <img src="https://placehold.co/440x300/1e293b/f59e0b?text=Forest+Trail" alt="Лісова стежка" class="photo-card__img">
          <figcaption class="photo-card__caption">Осіння стежка в лісі</figcaption>
        </figure>

        <figure class="photo-card">
          <img src="https://placehold.co/440x300/0f172a/a78bfa?text=Sea+Waves" alt="Морські хвилі" class="photo-card__img">
          <figcaption class="photo-card__caption">Хвилі біля узбережжя</figcaption>
        </figure>

        <figure class="photo-card photo-card--wide">
          <img src="https://placehold.co/900x420/1e293b/f472b6?text=City+Lights" alt="Нічне місто" class="photo-card__img">
          <figcaption class="photo-card__caption">Вечірні вогні мегаполіса</figcaption>
        </figure>

        <figure class="photo-card">
          <img src="https://placehold.co/440x300/0f172a/22d3ee?text=Desert+Dunes" alt="Піщані дюни" class="photo-card__img">
          <figcaption class="photo-card__caption">Піщані дюни в пустелі</figcaption>
        </figure>

        <figure class="photo-card">
          <img src="https://placehold.co/440x300/1e293b/fb923c?text=Lake+Reflection" alt="Озеро в горах" class="photo-card__img">
          <figcaption class="photo-card__caption">Відбиття вершин у воді</figcaption>
        </figure>

        <figure class="photo-card">
          <img src="https://placehold.co/440x300/0f172a/4ade80?text=Green+Valley" alt="Зелена долина" class="photo-card__img">
          <figcaption class="photo-card__caption">Зелена долина навесні</figcaption>
        </figure>

        <figure class="photo-card">
          <img src="https://placehold.co/440x300/1e293b/c084fc?text=Starry+Sky" alt="Зоряне небо" class="photo-card__img">
          <figcaption class="photo-card__caption">Нічне небо над степом</figcaption>
        </figure>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__text">Галерея фотографій • CSS Grid Практична робота</p>
    </footer>
  </div>
</body>
</html>
